name: trip_track
description: "Rayzon Solar Employee Travel & Kilometer Log"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  geolocator: ^13.0.2
  web_socket_channel: ^3.0.2
  battery_plus: ^6.2.1
  flutter_animate: ^4.5.2

  # Local Storage & Offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Camera & Image Processing
  camera: ^0.10.5+9
  image: ^4.1.7
  image_picker: ^1.0.7

  # Location & Maps
  location: ^6.0.2
  geocoding: ^3.0.0
  http: ^1.5.0
  url_launcher: ^6.2.2
  # flutter_easyloading: ^3.0.5
  permission_handler: ^11.1.0

  # UI & Animations
  lottie: ^3.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^17.2.2

  cupertino_icons: ^1.0.8
  change_app_package_name: ^1.5.0
  flutter_svg: ^2.1.0
  google_maps_flutter: ^2.17.0
  pointer_interceptor: ^0.10.1+2
  web: ^1.1.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  socket_io_client: ^3.1.6
  excel: ^4.0.6
  flutter_launcher_icons: ^0.14.4


dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^4.0.0
dependency_overrides:
  flutter_spinkit: ^5.2.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icons/ic_launcher.png"

  web:
    generate: true
    image_path: "assets/images/icons/ic_launcher.png"
    background_color: "#2196F3"
    theme_color: "#2196F3"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/icons/
    - assets/images/main_image/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
        - asset: assets/fonts/Poppins-BlackItalic.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-BoldItalic.ttf
        - asset: assets/fonts/Poppins-ExtraBold.ttf
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
        - asset: assets/fonts/Poppins-ExtraLight.ttf
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
        - asset: assets/fonts/Poppins-Light.ttf
        - asset: assets/fonts/Poppins-LightItalic.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-MediumItalic.ttf
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
        - asset: assets/fonts/Poppins-Thin.ttf
        - asset: assets/fonts/Poppins-ThinItalic.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Black.ttf
        - asset: assets/fonts/Outfit-Bold.ttf
        - asset: assets/fonts/Outfit-ExtraBold.ttf
        - asset: assets/fonts/Outfit-ExtraLight.ttf
        - asset: assets/fonts/Outfit-Light.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-SemiBold.ttf
        - asset: assets/fonts/Outfit-Thin.ttf
